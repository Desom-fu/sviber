name: Package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            osName: windows
            archName: x86
            nwPlatform: win
            arch: ia32
            archive: zip
          - os: windows-latest
            osName: windows
            archName: x86_64
            nwPlatform: win
            arch: x64
            archive: zip
          - os: windows-latest
            osName: windows
            archName: aarch64
            nwPlatform: win
            arch: arm64
            archive: zip
          - os: ubuntu-latest
            osName: linux
            archName: x86_64
            nwPlatform: linux
            arch: x64
            archive: tar.gz
          - os: ubuntu-latest
            osName: linux
            archName: aarch64
            nwPlatform: linux
            arch: arm64
            archive: tar.gz
          - os: macos-15-intel
            osName: macos
            archName: x86_64
            nwPlatform: osx
            arch: x64
            archive: dmg
          - os: macos-15
            osName: macos
            archName: aarch64
            nwPlatform: osx
            arch: arm64
            archive: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve release version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Build targeted NW.js app
        env:
          SVIBER_NW_PLATFORM: ${{ matrix.nwPlatform }}
          SVIBER_NW_ARCH: ${{ matrix.arch }}
        run: npm run build
      - name: Archive Windows app as ZIP
        if: startsWith(matrix.archName, 'x86')
        shell: pwsh
        run: Compress-Archive -Path build/nw/* -DestinationPath sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.zip
      - name: Archive Linux app as tar.gz
        if: startsWith(matrix.osName, 'linux')
        run: tar -czf sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.tar.gz -C build/nw .
      - name: Archive macOS app as DMG
        if: startsWith(matrix.osName, 'macos')
        run: hdiutil create -volname sviber -srcfolder build/nw -ov -format UDZO sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}
          path: sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.${{ matrix.archive }}
          if-no-files-found: error

  runtime-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build runtime-free NW.js package
        env:
          SVIBER_NW_PACKAGE_ONLY: 1
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-nw
          path: build/sviber-*.nw
          if-no-files-found: error
