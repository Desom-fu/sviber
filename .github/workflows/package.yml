name: Package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            osName: windows
            archName: x86
            nwPlatform: win
            arch: ia32
            archive: zip
          - os: windows-latest
            osName: windows
            archName: x86_64
            nwPlatform: win
            arch: x64
            archive: zip
          - os: windows-latest
            osName: windows
            archName: aarch64
            nwPlatform: win
            arch: arm64
            archive: zip
          - os: ubuntu-latest
            osName: linux
            archName: x86_64
            nwPlatform: linux
            arch: x64
            archive: tar.gz
          - os: ubuntu-latest
            osName: linux
            archName: aarch64
            nwPlatform: linux
            arch: arm64
            archive: tar.gz
          - os: macos-15-intel
            osName: macos
            archName: x86_64
            nwPlatform: osx
            arch: x64
            archive: dmg
          - os: macos-15
            osName: macos
            archName: aarch64
            nwPlatform: osx
            arch: arm64
            archive: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # canvas falls back to a source build when its prebuild download times out, and
      # that build requires the Cairo/Pango stack through pkg-config, which macOS
      # runners do not ship.
      - run: npm ci
      - name: Resolve release version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      # gl/canvas run in the bundled host Node render worker (v0.16.10), so they keep the
      # npm ci ABI. Rebuilding them against NW.js Node makes the worker fail to load gl.
      # Retry the NW.js download: getter sometimes caches an empty tarball (SHA256 e3b0c442).
      - name: Build targeted NW.js app
        env:
          SVIBER_NW_PLATFORM: ${{ matrix.nwPlatform }}
          SVIBER_NW_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            echo "NW.js build failed on attempt ${attempt}; clearing getter cache"
            rm -rf node_modules/nw/nwjs* || true
            find node_modules/nw -name '*.tar.gz' -delete || true
            sleep 5
          done
          exit 1
      - name: Archive Windows app as ZIP
        if: startsWith(matrix.osName, 'windows')
        shell: pwsh
        run: Compress-Archive -Path build/nw/* -DestinationPath sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.zip
      - name: Compile Windows installer
        if: startsWith(matrix.osName, 'windows')
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $compiler = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe")
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            throw "Inno Setup compiler was not found."
          }
          & $compiler /DAppVersion=${{ env.version }} /DArchitecture=${{ matrix.archName }} packaging/windows/sviber.iss
      - name: Archive Linux app as tar.gz
        if: startsWith(matrix.osName, 'linux')
        run: tar -czf sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.tar.gz -C build/nw .
      - name: Archive macOS app as DMG
        if: startsWith(matrix.osName, 'macos')
        run: hdiutil create -volname sviber -srcfolder build/nw -ov -format UDZO sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}
          path: |
            sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.${{ matrix.archive }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: startsWith(matrix.osName, 'windows')
        with:
          name: sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}-installer
          path: build/installer/sviber-${{ env.version }}-${{ matrix.archName }}-setup.exe
          if-no-files-found: error

  runtime-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build runtime-free NW.js package
        env:
          SVIBER_NW_PACKAGE_ONLY: 1
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-nw
          path: build/sviber-*.nw
          if-no-files-found: error
