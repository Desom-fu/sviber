name: Package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86
            nwPlatform: win
            arch: ia32
            archive: zip
          - os: windows-latest
            platform: windows-x86_64
            nwPlatform: win
            arch: x64
            archive: zip
          - os: windows-latest
            platform: windows-aarch64
            nwPlatform: win
            arch: arm64
            archive: zip
          - os: ubuntu-latest
            platform: linux-x86_64
            nwPlatform: linux
            arch: x64
            archive: tar.gz
          - os: ubuntu-latest
            platform: linux-aarch64
            nwPlatform: linux
            arch: arm64
            archive: tar.gz
          - os: macos-15-intel
            platform: macos-x86_64
            nwPlatform: osx
            arch: x64
            archive: zip
          - os: macos-15
            platform: macos-aarch64
            nwPlatform: osx
            arch: arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build targeted NW.js app
        env:
          SVIBER_NW_PLATFORM: ${{ matrix.nwPlatform }}
          SVIBER_NW_ARCH: ${{ matrix.arch }}
        run: npm run build
      - name: Archive Windows app as ZIP
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: Compress-Archive -Path build/nw/* -DestinationPath sviber-${{ matrix.platform }}.zip
      - name: Archive Linux app as tar.gz
        if: startsWith(matrix.platform, 'linux-')
        run: tar -czf sviber-${{ matrix.platform }}.tar.gz -C build/nw .
      - name: Archive macOS app as ZIP
        if: startsWith(matrix.platform, 'macos-')
        run: ditto -c -k --sequesterRsrc build/nw sviber-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-${{ matrix.platform }}
          path: sviber-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error

  runtime-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build runtime-free NW.js package
        env:
          SVIBER_NW_PACKAGE_ONLY: 1
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-nw
          path: build/sviber-*.nw
          if-no-files-found: error
