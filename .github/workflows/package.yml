name: Package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            osName: windows
            archName: x86
            nwPlatform: win
            arch: ia32
            archive: zip
          - os: windows-latest
            osName: windows
            archName: x86_64
            nwPlatform: win
            arch: x64
            archive: zip
          - os: windows-latest
            osName: windows
            archName: aarch64
            nwPlatform: win
            arch: arm64
            archive: zip
          - os: ubuntu-latest
            osName: linux
            archName: x86_64
            nwPlatform: linux
            arch: x64
            archive: tar.gz
          - os: ubuntu-latest
            osName: linux
            archName: aarch64
            nwPlatform: linux
            arch: arm64
            archive: tar.gz
          - os: macos-15-intel
            osName: macos
            archName: x86_64
            nwPlatform: osx
            arch: x64
            archive: dmg
          - os: macos-15
            osName: macos
            archName: aarch64
            nwPlatform: osx
            arch: arm64
            archive: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # canvas falls back to a source build when its prebuild download times out, and
      # that build requires the Cairo/Pango stack through pkg-config, which macOS
      # runners do not ship.
      - name: Install native build prerequisites (macOS)
        if: startsWith(matrix.osName, 'macos')
        run: brew install pkg-config cairo pango giflib libjpeg librsvg
      - run: npm ci
      - name: Resolve release version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Build targeted NW.js app
        env:
          SVIBER_NW_PLATFORM: ${{ matrix.nwPlatform }}
          SVIBER_NW_ARCH: ${{ matrix.arch }}
        run: npm run build
      # PROMPT-v25: sunniesnow-record needs gl and canvas. When the runner architecture
      # matches the target, rebuild them from source inside the packaged node_modules so
      # the release ships compiled native modules instead of prebuilt binaries. Cross
      # builds (windows aarch64, linux aarch64) keep the prebuilt binaries because the
      # runner cannot execute the target toolchain.
      - name: Install native build prerequisites (Linux)
        if: startsWith(matrix.osName, 'linux') && matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-dev libgl1-mesa-dev libglu1-mesa-dev libxi-dev libxext-dev
      # Runtime natives (gl, canvas) are rebuilt against the NW.js Node ABI. Development
      # natives such as sharp stay on the host Node from `npm ci`.
      - name: Rebuild gl and canvas native modules against NW.js Node
        if: >-
          (startsWith(matrix.osName, 'windows') && matrix.arch == 'x64') ||
          (startsWith(matrix.osName, 'linux') && matrix.arch == 'x64') ||
          startsWith(matrix.osName, 'macos')
        shell: bash
        run: |
          NW_VERSION=$(node -p "require('./node_modules/nw/package.json').version")
          DISTURL=$(node --input-type=module -e "import { NWJS_HEADERS_DISTURL } from './scripts/nw-runtime-natives.mjs'; process.stdout.write(NWJS_HEADERS_DISTURL)")
          TARBALL=$(node --input-type=module -e "import { nwjsHeadersTarball } from './scripts/nw-runtime-natives.mjs'; process.stdout.write(nwjsHeadersTarball(process.argv[1]))" "$NW_VERSION")
          cd build/nw
          npm_config_runtime=node-webkit \
            npm_config_target="$NW_VERSION" \
            npm_config_disturl="$DISTURL" \
            npm_config_tarball="$TARBALL" \
            npm rebuild gl canvas --update-binary --foreground-scripts
      - name: Archive Windows app as ZIP
        if: startsWith(matrix.osName, 'windows')
        shell: pwsh
        run: Compress-Archive -Path build/nw/* -DestinationPath sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.zip
      - name: Compile Windows installer
        if: startsWith(matrix.osName, 'windows')
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $compiler = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe")
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            throw "Inno Setup compiler was not found."
          }
          & $compiler /DAppVersion=${{ env.version }} /DArchitecture=${{ matrix.archName }} packaging/windows/sviber.iss
      - name: Archive Linux app as tar.gz
        if: startsWith(matrix.osName, 'linux')
        run: tar -czf sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.tar.gz -C build/nw .
      - name: Archive macOS app as DMG
        if: startsWith(matrix.osName, 'macos')
        run: hdiutil create -volname sviber -srcfolder build/nw -ov -format UDZO sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}
          path: |
            sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}.${{ matrix.archive }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: startsWith(matrix.osName, 'windows')
        with:
          name: sviber-${{ env.version }}-${{ matrix.osName }}-${{ matrix.archName }}-installer
          path: build/installer/sviber-${{ env.version }}-${{ matrix.archName }}-setup.exe
          if-no-files-found: error

  runtime-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build runtime-free NW.js package
        env:
          SVIBER_NW_PACKAGE_ONLY: 1
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-nw
          path: build/sviber-*.nw
          if-no-files-found: error
