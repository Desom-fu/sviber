name: Test, build, and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run benchmark:render

  package:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            nwPlatform: win
            arch: x64
            archive: zip
          - os: windows-latest
            platform: windows-x86
            nwPlatform: win
            arch: ia32
            archive: zip
          - os: windows-latest
            platform: windows-arm64
            nwPlatform: win
            arch: arm64
            archive: zip
          - os: ubuntu-latest
            platform: linux-x64
            nwPlatform: linux
            arch: x64
            archive: tar.gz
          - os: ubuntu-latest
            platform: linux-arm64
            nwPlatform: linux
            arch: arm64
            archive: tar.gz
          - os: macos-15-intel
            platform: macos-x64
            nwPlatform: osx
            arch: x64
            archive: zip
          - os: macos-15-intel
            platform: macos-arm64
            nwPlatform: osx
            arch: arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build targeted NW.js package
        env:
          SVIBER_NW_PLATFORM: ${{ matrix.nwPlatform }}
          SVIBER_NW_ARCH: ${{ matrix.arch }}
        run: npm run build
      - name: Archive Windows build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path build/nw/* -DestinationPath sviber-${{ matrix.platform }}.zip
      - name: Archive macOS build
        if: matrix.os == 'macos-15-intel'
        run: cd build/nw && zip -qr ../../sviber-${{ matrix.platform }}.zip .
      - name: Archive Linux build
        if: matrix.archive == 'tar.gz'
        run: tar -czf sviber-${{ matrix.platform }}.tar.gz -C build/nw .
      - uses: actions/upload-artifact@v7
        with:
          name: sviber-${{ matrix.platform }}
          path: sviber-${{ matrix.platform }}.${{ matrix.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.zip
            release/*.tar.gz
