<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#25282c">
	<meta name="description" content="A desktop-style chart editor for Sunniesnow">
	<meta property="og:type" content="website">
	<meta property="og:title" content="sviber Sunniesnow chart editor">
	<meta property="og:description" content="A practical desktop-style chart editor for Sunniesnow.">
	<meta property="og:url" content="https://sunniesnow.github.io/sviber/">
	<meta property="og:image" content="svg/icon.svg">
	<meta name="twitter:card" content="summary">
	<meta name="twitter:title" content="sviber Sunniesnow chart editor">
	<meta name="twitter:description" content="A practical desktop-style chart editor for Sunniesnow.">
	<meta name="twitter:image" content="svg/icon.svg">
	<title>Untitled Normal - sviber</title>
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="svg/icon.svg" type="image/svg+xml">
	<script src="js/theme-bootstrap.js"></script>
	<script src="js/font-loader.js"></script>
	<link rel="stylesheet" href="css/app.css">
	<link rel="stylesheet" href="css/app-v11.css">
</head>
<body>
	<div id="app" class="app-shell" aria-busy="true">
		<header class="app-chrome">
			<nav id="menu-bar" class="menu-bar" aria-label="Application menu" data-i18n-aria-label="aria.applicationMenu"></nav>
			<div class="tool-row">
				<div id="tool-bar" class="tool-bar" role="toolbar" aria-label="Chart tools" data-i18n-aria-label="aria.chartTools"></div>
				<div class="difficulty-switcher" aria-label="Difficulties" data-i18n-aria-label="aria.difficulties" hidden>
					<select id="difficulty-select" aria-label="Difficulty" data-tooltip-key="difficulty.select"></select>
				</div>
			</div>
		</header>

		<main class="workspace">
			<section class="timeline-row" aria-label="Timeline" data-i18n-aria-label="aria.timeline">
				<div id="timeline-surface" class="render-surface timeline-surface" tabindex="0"></div>
				<aside id="status-panel" class="status-panel" aria-label="Playback status" data-i18n-aria-label="aria.playbackStatus">
					<dl>
						<div class="status-item" data-tooltip-key="tooltip.time"><dt data-i18n="status.time">Time</dt><dd id="status-time">0:00.000</dd></div>
						<div class="status-item" data-tooltip-key="tooltip.beat"><dt data-i18n="status.beat">Beat</dt><dd id="status-beat">0+0/2</dd></div>
						<div class="status-item" data-tooltip-key="tooltip.speed"><dt data-i18n="status.speed">Speed</dt><dd id="status-speed">1.0</dd></div>
					</dl>
					<div class="status-options" role="group" aria-label="Playback options" data-i18n-aria-label="status.options">
						<label class="status-option" data-tooltip-key="status.lockVisibleRange"><input id="lock-visible-range" type="checkbox" aria-label="Lock visible range" data-i18n-aria-label="status.lockVisibleRange"><img src="svg/icons/lock-visible-range.svg" alt="" aria-hidden="true"></label>
						<label class="status-option" data-tooltip-key="status.playSe"><input id="play-se" type="checkbox" aria-label="SE" data-i18n-aria-label="status.playSe"><img src="svg/icons/se.svg" alt="" aria-hidden="true"></label>
						<label class="status-option" data-tooltip-key="status.seekBackAfterPlaying"><input id="seek-back-after-playing" type="checkbox" aria-label="Seek back after playing" data-i18n-aria-label="status.seekBackAfterPlaying"><img src="svg/icons/seek-back-after-playing.svg" alt="" aria-hidden="true"></label>
						<label class="status-option" data-tooltip-key="status.metronome"><input id="metronome" type="checkbox" aria-label="Metronome" data-i18n-aria-label="status.metronome"><img src="svg/icons/metronome.svg" alt="" aria-hidden="true"></label>
						<label class="status-option" data-tooltip-key="status.readOnly"><input id="read-only" type="checkbox" aria-label="Read-only" data-i18n-aria-label="status.readOnly"><img src="svg/icons/read-only.svg" alt="" aria-hidden="true"></label>
						<label class="status-option" data-tooltip-key="status.fullscreen"><input id="fullscreen" type="checkbox" aria-label="Fullscreen" data-i18n-aria-label="status.fullscreen"><img src="svg/icons/fullscreen.svg" alt="" aria-hidden="true"></label>
					</div>
					<div id="status-comments" class="status-comments" aria-live="polite"></div>
					<div id="operation-status" class="operation-status" aria-live="polite"></div>
				</aside>
			</section>

			<section class="editor-row" aria-label="Chart editor" data-i18n-aria-label="aria.chartEditor">
				<aside id="scroll-view-panel" class="scroll-view-panel" aria-label="Scroll view" data-i18n-aria-label="aria.scrollView">
					<div id="scroll-surface" class="render-surface scroll-surface" tabindex="0"></div>
				</aside>
				<div id="stage-surface" class="render-surface stage-surface" tabindex="0">
					<button id="scroll-view-toggle" class="edge-toggle edge-toggle-left" type="button" aria-label="Hide scroll view" data-tooltip-key="layout.hideScrollView">&#8249;</button>
					<button id="side-panel-toggle" class="edge-toggle edge-toggle-right" type="button" aria-label="Hide side panels" data-tooltip-key="layout.hideSidePanel">&#8250;</button>
				</div>
				<aside class="side-panel">
					<div class="side-tabs" role="tablist">
						<button id="inspector-tab" class="side-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="inspector-panel" data-i18n="panel.inspector">Inspector</button>
						<button id="channels-tab" class="side-tab" type="button" role="tab" aria-selected="false" aria-controls="channels-panel" data-i18n="panel.channels">Channels</button>
						<button id="snappees-tab" class="side-tab" type="button" role="tab" aria-selected="false" aria-controls="snappees-panel" data-i18n="panel.snappees">Snappees</button>
					</div>
					<section id="inspector-panel" class="property-panel" role="tabpanel" aria-labelledby="inspector-tab"></section>
					<section id="channels-panel" class="property-panel" role="tabpanel" aria-labelledby="channels-tab" hidden></section>
					<section id="snappees-panel" class="property-panel" role="tabpanel" aria-labelledby="snappees-tab" hidden></section>
					<section class="history-panel" aria-label="History" data-i18n-aria-label="aria.history">
						<div class="panel-heading" data-i18n="panel.history">History</div>
						<div id="history-list" class="history-list"></div>
					</section>
				</aside>
			</section>
		</main>

		<footer id="tooltip-bar" class="tooltip-bar" aria-live="polite">
			<span class="tooltip-label" data-i18n="tooltip.label">Hint</span>
			<span id="tooltip-text" data-i18n="tooltip.ready">Ready</span>
			<a class="javascript-license-link" href="javascript.html" target="sviber-license" data-jslicense="1">JavaScript license information</a>
		</footer>
	</div>

	<div id="modal-layer" class="modal-layer" hidden></div>
	<div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
	<div id="loading-screen" class="loading-screen">
		<div class="loading-mark" aria-hidden="true"><span></span><span></span><span></span></div>
		<strong>sviber</strong>
		<span data-i18n="loading">Loading editor...</span>
	</div>

	<input id="open-file-input" class="visually-hidden" type="file" accept=".json,.ssc,application/json,application/zip">
	<input id="chart-file-input" class="visually-hidden" type="file" accept=".json,application/json">
	<input id="music-file-input" class="visually-hidden" type="file" accept="audio/*">
	<input id="background-file-input" class="visually-hidden" type="file" accept="image/*">

	<script src="js/nw-source-bootstrap.js"></script>
	<script src="js/vendor-loader.js"></script>
	<script type="module" src="js/app.js?v=23"></script>
</body>
</html>
