<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#25282c">
	<title data-i18n="page.title">sviber Macros</title>
	<link rel="icon" href="svg/icon.svg" type="image/svg+xml">
	<script src="js/boot/theme-bootstrap.js"></script>
	<link rel="stylesheet" href="css/macros.css">
</head>
<body>
	<div class="macro-shell">
		<header class="macro-chrome">
			<nav class="menu-bar" aria-label="Macros menu" data-i18n-aria="menu.aria">
				<div class="menu-root">
					<button type="button" class="menu-root-button" data-menu="file" data-i18n="menu.file" data-mnemonic="F">File</button>
					<div class="menu-popup" data-popup="file" role="menu">
						<button type="button" class="menu-command" data-action="new"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.new">New...</span><span class="menu-shortcut">Ctrl+N</span></button>
						<button type="button" class="menu-command" data-action="save"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.save">Save</span><span class="menu-shortcut">Ctrl+S</span></button>
						<button type="button" class="menu-command" data-action="rename"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.rename">Rename...</span><span class="menu-shortcut"></span></button>
						<button type="button" class="menu-command" data-action="import"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.import">Import...</span><span class="menu-shortcut"></span></button>
						<button type="button" class="menu-command" data-action="export"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.export">Export...</span><span class="menu-shortcut"></span></button>
						<button type="button" class="menu-command" data-action="delete"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.delete">Delete...</span><span class="menu-shortcut"></span></button>
					</div>
				</div>
				<div class="menu-root">
					<button type="button" class="menu-root-button" data-menu="edit" data-i18n="menu.edit" data-mnemonic="E">Edit</button>
					<div class="menu-popup" data-popup="edit" role="menu">
						<button type="button" class="menu-command" data-action="undo"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.undo">Undo</span><span class="menu-shortcut">Ctrl+Z</span></button>
						<button type="button" class="menu-command" data-action="redo"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.redo">Redo</span><span class="menu-shortcut">Ctrl+Y</span></button>
						<div class="menu-separator" role="separator"></div>
						<button type="button" class="menu-command" data-action="cut"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.cut">Cut</span><span class="menu-shortcut">Ctrl+X</span></button>
						<button type="button" class="menu-command" data-action="copy"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.copy">Copy</span><span class="menu-shortcut">Ctrl+C</span></button>
						<button type="button" class="menu-command" data-action="paste"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.paste">Paste</span><span class="menu-shortcut">Ctrl+V</span></button>
					</div>
				</div>
				<div class="menu-root">
					<button type="button" class="menu-root-button" data-menu="view" data-i18n="menu.view" data-mnemonic="V">View</button>
					<div class="menu-popup" data-popup="view" role="menu">
						<button type="button" class="menu-command" data-action="toggle-console"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.toggleConsole">Toggle console</span><span class="menu-shortcut"></span></button>
						<button type="button" class="menu-command" data-action="reset-layout"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.resetLayout">Reset to default</span><span class="menu-shortcut"></span></button>
					</div>
				</div>
				<div class="menu-root">
					<button type="button" class="menu-root-button" data-menu="run" data-i18n="menu.run" data-mnemonic="R">Run</button>
					<div class="menu-popup" data-popup="run" role="menu">
						<button type="button" class="menu-command" data-action="run"><span class="menu-command-icon"></span><span class="menu-command-label" data-i18n="menu.run">Run</span><span class="menu-shortcut">F8</span></button>
					</div>
				</div>
			</nav>
		</header>
		<main class="macro-workspace">
			<aside class="macro-sidebar">
				<div class="side-tabs" role="tablist">
					<button type="button" class="side-tab is-active" data-list="global" role="tab" data-i18n="list.global">Global</button>
					<button type="button" class="side-tab" data-list="project" role="tab" disabled data-i18n="list.project">Project</button>
				</div>
				<div id="macro-list" class="file-list"></div>
			</aside>
			<section class="macro-editor-area">
				<div id="macro-editor-tabs" class="editor-tabs"></div>
				<div id="macro-editor" class="macro-editor" aria-label="Macro code editor" data-i18n-aria="editor.aria"></div>
				<textarea id="macro-fallback" class="macro-fallback" spellcheck="false" hidden></textarea>
				<section class="macro-console"><div class="console-heading" data-i18n="console.heading">Console</div><pre id="macro-console-output"></pre></section>
			</section>
		</main>
	</div>
	<dialog id="macro-form-dialog" aria-labelledby="macro-form-title">
		<form id="macro-form">
			<h2 id="macro-form-title" data-i18n="form.newTitle">New macro</h2>
			<label class="macro-form-field"><span data-i18n="form.name">Name</span><input id="macro-form-name" type="text" required autocomplete="off"></label>
			<fieldset id="macro-form-scope-field" class="macro-form-scope">
				<legend data-i18n="form.scope">Macro scope</legend>
				<label><input type="radio" name="macro-scope" value="global" checked><span data-i18n="list.global">Global</span></label>
				<label><input type="radio" name="macro-scope" value="project"><span data-i18n="list.project">Project</span></label>
			</fieldset>
			<fieldset id="macro-form-language-field" class="macro-form-scope">
				<legend data-i18n="form.language">Macro language</legend>
				<label><input type="radio" name="macro-language" value="javascript" checked><span data-i18n="language.javascript">JavaScript</span></label>
				<label><input type="radio" name="macro-language" value="ruby"><span data-i18n="language.ruby">Ruby</span></label>
			</fieldset>
			<p id="macro-form-error" class="macro-form-error" role="alert" hidden></p>
			<div class="macro-form-actions"><button type="button" value="cancel" data-macro-cancel data-i18n="form.cancel">Cancel</button><button type="submit" data-i18n="form.ok">OK</button></div>
		</form>
	</dialog>
	<input id="macro-import" type="file" accept=".js,.rb,text/javascript,text/x-ruby" hidden>
	<script type="module" src="js/macro/macros.js"></script>
</body>
</html>
